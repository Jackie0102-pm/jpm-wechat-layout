<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排版切换总览</title><style>*{box-sizing:border-box}body{margin:0;background:#efefeb;font:14px system-ui;color:#30362e}.app{display:flex;height:100dvh}aside{width:245px;padding:24px 16px;overflow:auto;background:#fafaf7;border-right:1px solid #ddd}h1{font-size:21px}button{font:inherit;cursor:pointer}aside button{width:100%;text-align:left;padding:15px 12px;margin-bottom:8px;background:white;border:1px solid #ddd;border-radius:7px}button[aria-pressed=true]{background:#e2ead9;border-color:#596a4c}small{display:block;font-size:10px;color:#6f7768;margin-top:7px;line-height:1.7}main{flex:1;min-width:0;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:16px;gap:10px;background:#fafaf7;flex-wrap:wrap}header a{color:#405338}select{padding:5px;max-width:130px}.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:12px}iframe{width:390px;max-width:100%;height:100%;border:1px solid #ddd;background:white}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #587347}@media(max-width:650px){.app{display:block;height:auto}aside{width:auto;padding:12px}#themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}aside button{font-size:11px;padding:9px 5px;margin:0}small{display:none}main{height:80dvh}h1{margin:4px 0 12px;font-size:18px}}</style><div class="app"><aside><h1>选择排版样式</h1><div id="themes"></div></aside><main><header><strong id="current"></strong><select id="chapter" aria-label="章节定位"><option value="0">开篇</option></select><button id="width">切换宽版</button><a id="open" target="_blank" rel="noopener">独立打开 / 复制正文</a></header><div class="stage"><iframe sandbox="allow-same-origin" id="frame" title="文章预览"></iframe></div></main></div><script type="application/json" id="data">__DATA__</script><script>
const items=JSON.parse(document.querySelector('#data').textContent),frame=document.querySelector('#frame'),chapter=document.querySelector('#chapter');let selected=0,wide=false,position=0;function jump(){const d=frame.contentDocument;if(!d)return;const el=d.getElementById('chapter'+position);frame.contentWindow.scrollTo(0,el?el.getBoundingClientRect().top+frame.contentWindow.scrollY:0)}function show(i){selected=i;const t=items[i];document.querySelector('#current').textContent=t.name;document.querySelector('#open').href=t.url;document.querySelectorAll('#themes button').forEach((b,k)=>b.setAttribute('aria-pressed',k===i));chapter.replaceChildren();[['','开篇'],...t.nav].forEach(([id,text],n)=>{let o=document.createElement('option');o.value=n;o.textContent=text;chapter.append(o)});position=Math.min(position,t.nav.length);chapter.value=position;let body=t.clean;for(const [id] of t.nav)body=body.replace('<!-- '+id+' --><section','<section id="'+id+'"');frame.srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0}main{max-width:600px;margin:0 auto}</style><main id="article">'+body+'</main>'}items.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t.number+' '+t.name;let s=document.createElement('small');s.textContent=t.description;b.append(s);b.onclick=()=>show(i);document.querySelector('#themes').append(b)});frame.onload=()=>{jump();for(const image of frame.contentDocument.images)image.addEventListener('load',jump,{once:true})};chapter.onchange=()=>{position=Number(chapter.value);jump()};document.querySelector('#width').onclick=e=>{wide=!wide;frame.style.width=wide?'600px':'390px';e.target.textContent=wide?'切换手机版':'切换宽版';requestAnimationFrame(jump)};show(0);
</script></html>
