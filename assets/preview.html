<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文章预览</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeee9;font-family:system-ui}.bar{position:sticky;top:0;background:white;padding:12px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #ddd;z-index:2}select,button{padding:8px;max-width:60%;font:inherit;font-size:12px}main{max-width:600px;margin:20px auto}#article [id]{scroll-margin-top:72px}#status{text-align:center;font-size:12px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #205ba7}</style><nav class="bar"><select id="nav" aria-label="章节导航"><option value="">开篇</option></select><button id="copy">复制到公众号</button></nav><main id="article"></main><p id="status" role="status"></p><script id="data" type="application/json">__DATA__</script><script>
const d=JSON.parse(document.querySelector('#data').textContent);document.title=d.title;let body=d.clean;for(const [id,name] of d.nav){body=body.replace('<!-- '+id+' --><section','<section id="'+id+'"');let o=document.createElement('option');o.value=id;o.textContent=name;nav.append(o)}document.querySelector('#article').innerHTML=body;nav.onchange=()=>{if(nav.value)document.getElementById(nav.value).scrollIntoView();else scrollTo(0,0)};window.layoutJump=(i)=>{nav.selectedIndex=Math.min(i,nav.options.length-1);nav.onchange()};document.querySelector('#copy').onclick=async()=>{let temp=document.createElement('div');temp.innerHTML=d.clean;let ok=false;try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([d.clean],{type:'text/html'}),'text/plain':new Blob([temp.textContent],{type:'text/plain'})})]);ok=true}catch(e){temp.style.cssText='position:fixed;left:-10000px';document.body.append(temp);let range=document.createRange();range.selectNodeContents(temp);let s=getSelection();s.removeAllRanges();s.addRange(range);try{ok=document.execCommand('copy')}catch(e){}s.removeAllRanges();temp.remove()}document.querySelector('#status').textContent=ok?'正文已复制，请粘贴后检查。':'复制未成功，请打开同目录正文文件手动复制。'};
</script></html>
